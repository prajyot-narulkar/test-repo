name: Read Secret From AWS Secrets Manager

on:
  workflow_dispatch:
  push:
    branches:
      - develop

env:
  AWS_REGION: us-east-1
  SECRET_ID: codebuild/github-omc-annalect-token
  # Optional for JSON formatted secrets, for example: token
  SECRET_JSON_KEY: ""

jobs:
  build:
    runs-on: codebuild-codebuild-github-infra-test-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      id-token: write
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Retrieve secret and set environment variable
        shell: bash
        run: |
          SECRET_STRING=$(aws secretsmanager get-secret-value \
            --secret-id "$SECRET_ID" \
            --query SecretString \
            --output text)

          SECRET_VALUE="$SECRET_STRING"
          if [[ -n "$SECRET_JSON_KEY" ]]; then
            SECRET_VALUE=$(jq -r --arg key "$SECRET_JSON_KEY" '.[$key]' <<< "$SECRET_STRING")
          fi

          echo "$SECRET_VALUE"
          echo "GITHUB_PAT_TOKEN=$SECRET_VALUE" >> "$GITHUB_ENV"

      - name: Validate token data (safe)
        shell: bash
        run: |
          if [[ -z "$GITHUB_PAT_TOKEN" ]]; then
            echo "GITHUB_PAT_TOKEN is empty"
            exit 1
          fi

          TOKEN_LEN=${#GITHUB_PAT_TOKEN}
          TOKEN_SHA=$(printf '%s' "$GITHUB_PAT_TOKEN" | shasum -a 256 | awk '{print $1}')

          echo "GITHUB_PAT_TOKEN is set"
          echo "Token length: $TOKEN_LEN"
          echo "Token SHA256 prefix: ${TOKEN_SHA:0:12}"
